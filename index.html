function timed(n,c,tm){
const m=/^([01]?\d|2[0-3])[:.]([0-5]\d)$/.exec(tm);
if(!m){say('Тетрадь не понимает такое время. Нужен формат ЧЧ:ММ, например 21:30.','w');return 1}
const t=+m[1]*60+ +m[2];
if(t<=S.clock){say('Это время уже прошло — тетрадь не пишет в прошлое. Имя не записано.','w');return 1}
const e=E.find(e=>e.m.test(n));
if(e){if(!QN.includes(e.need)){say('Для этого имени время ничего не меняет: тетрадь отвечает сразу или молчит. Запись не принята.','w');return 1}
if(!S.f[e.need]&&!S.f.eyes2){say('Лицо этого человека тебе неизвестно. Тетрадь не отзывается.','w');return 1}}
else if(!S.news.some(x=>norm(x[0]).split(' ').every(w=>n.includes(w)))){say('Этого лица ты не знаешь — тетрадь молчит.','w');return 1}
S.pend.push({n,c,t,tm});say('Принято. Смерть назначена на '+tm+' — тетрадь ждёт.','w');return 1}

if(!fo.length&&rn()<.6){const r=el.filter(e=>e.w>0&&e.w<99);let x=rn()*r.reduce((a,e)=>a+e.w,0),p=null;for(const e of r){x-=e.w;if(x<=0){p=e;break}}if(p){T.seen[p.id]=1;if(p.neg&&T.f.intel){T.f.intel=0;T.susp-=2;out.push('Информация полиции смягчила удар.')}out.push(p.f())}}return out}

T.lim[a.id]=(T.lim[a.id]||0)+1;qadd('act',a.id,a.dl);T.hist.push('Ход '+T.turn+': «'+a.n+'»');

function scn(){const m=[['tv','Телеловушка: ты вывел в эфир Линда Л. Тейлора. Кира ответил — теперь известно, что он в Канто и видит ТВ.',()=>{ev('light',8);L.expo+=6}],['quiet','Тихое начало: Кира ничем себя не выдал. Первые дни — сбор данных.',()=>{}],['early','Раннее подозрение: время смертей уже указывает на студентов Токио.',()=>{ev('light',10)}],['leak','Утечка: данные полиции попали в прессу — Кира знает больше, но и ты получил следы.',()=>{ev('light',4);L.expo+=4}],['strat','Кира сменил тактику: первые ночи без смертей.',()=>{L.kp=['h']}]][Math.floor(Math.random()*5)];L.sc=m[0];say(m[1],'w');m[2]()}

   if(MP.ex>=60&&MP.difficulty=='hard')preferred.push('k5');

function mpApply(k,l){MP.lastActions=MP.lastActions||{k:[],l:[]};MP.playerStats=MP.playerStats||{k:{actions:0,bluffs:0},l:{actions:0,checks:0}};MP.lastActions.k.push(k);MP.lastActions.l.push(l);MP.lastActions.k=MP.lastActions.k.slice(-6);MP.lastActions.l=MP.lastActions.l.slice(-6);MP.playerStats.k.actions++;MP.playerStats.l.actions++;if(k=='k4'||k=='k9')MP.playerStats.k.bluffs++;if(['l3','l7','l8'].includes(l))MP.playerStats.l.checks++;const r=mpRes(MP,k,l);MP.ev=r.ev;MP.ex=r.ex;MP.sc=r.sc;MP.lines=r.o;MP.clues=MP.clues||[];if(l=='l1'||l=='l2'||l=='l3'||l=='l6')MP.clues.push('Ход '+MP.turn+': '+(MLA2.find(a=>a[0]==l)||[])[1]);if(k=='k6')MP.usedEyes=true;if(k=='k7')MP.usedMisa=true;if(l=='l6')MP.usedWitness=true;if(l=='l7')MP.verifiedAlibi=true;

 // Make the existing investigation board cards open an accessible detail note.
 if(typeof updateCaseBoard==='function'){const originalBoard=updateCaseBoard;window.updateCaseBoard=function(){originalBoard();decorateBoard()};}
 function decorateBoard(){const grid=$('casegrid');if(!grid)return;grid.querySelectorAll('.cbitem').forEach((card,i)=>{card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-expanded','false');const activate=()=>{const old=grid.querySelector('.cb-detail');if(old&&old.dataset.owner===String(i)){old.remove();card.setAttribute('aria-expanded','false');return}if(old)old.remove();grid.querySelectorAll('.cbitem').forEach(x=>x.setAttribute('aria-expanded','false'));const detail=document.createElement('div');detail.className='cb-detail';detail.dataset.owner=String(i);const title=card.querySelector('b')?.textContent||'Деталь';const hints=['Общее количество зарегистрированных смертей в текущей сюжетной ветке. Сопоставляй события и даты, а не только число.','Уровень внимания следствия. Резкие и повторяющиеся действия могут ускорить расследование.','Показатель алиби и публичных появлений. Проверяй его вместе с временной линией событий.','Доступные следствию улики. Некоторые сведения могут быть неполными или противоречивыми.'];detail.textContent=title+'. '+(hints[i]||'Показатель обновляется по мере прохождения сюжета.');card.after(detail);card.setAttribute('aria-expanded','true')};card.onclick=activate;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}}})}
 decorateBoard();
 // Cinematic transition stamp on multiplayer phase changes, without altering game state.
 if(typeof mpr==='function'){const originalMpr=mpr;window.mpr=function(){originalMpr();decorateMultiplayer()}}
 let lastPhase='',lastTurn=0;
 function decorateMultiplayer(){const panel=$('pm');if(!panel||panel.hidden||!window.MP)return;const phase=MP.phase,turn=MP.turn;if(phase!==lastPhase||turn!==lastTurn){panel.classList.remove('dn-phase-change');void panel.offsetWidth;panel.classList.add('dn-phase-change');lastPhase=phase;lastTurn=turn}const scene=panel.querySelector('.mp-scene');if(scene){scene.setAttribute('aria-live','polite');scene.setAttribute('aria-atomic','true')}const hero=panel.querySelector('.mp-hero');if(hero){hero.dataset.activeRole=MP.role||'none';const names=hero.querySelectorAll('.mp-name');if(names[0])names[0].textContent=MP.role==='k'?'Кира / Лайт':'Кира / Лайт';if(names[1])names[1].textContent=MP.role==='l'?'Эл · твоя роль':'Эл'}const actionButtons=panel.querySelectorAll('.mp-actiongrid button');actionButtons.forEach(b=>{if(!b.getAttribute('aria-label'))b.setAttribute('aria-label',b.innerText.replace(/\s+/g,' ').trim())})}
 // Avoid claiming to play external music; the existing in-game sound system remains in control.
 document.addEventListener('visibilitychange',()=>{if(document.hidden)document.body.classList.add('dn-paused');else document.body.classList.remove('dn-paused')});
})();
</script>

<script>
(function(){
 const key='dn_complete_visual_prefs_v2';
 const $=id=>document.getElementById(id);
 const defaults={theme:'',motion:true,effects:true,contrast:false,font:'normal'};
 let p={...defaults};try{p={...p,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}
 function apply(){
  if(p.theme)document.documentElement.dataset.theme=p.theme;else delete document.documentElement.dataset.theme;
  document.body.dataset.animations=p.motion?'on':'off';
  document.body.dataset.motion=p.motion?'full':'reduce';
  document.body.dataset.effects=p.effects?'1':'0';
  document.body.dataset.highContrast=p.contrast?'1':'0';
  document.body.dataset.font=p.font;
  try{localStorage.setItem(key,JSON.stringify(p))}catch(e){}
 }
 apply();
 const bind=(id,fn)=>{const e=$(id);if(e)e.addEventListener('change',()=>{fn(e);apply()})};
 const theme=$('st');if(theme){theme.value=p.theme;bind('st',e=>p.theme=e.value)}
 const anim=$('sa');if(anim){anim.checked=p.motion;bind('sa',e=>p.motion=e.checked)}
 const fx=$('sf');if(fx){fx.checked=p.effects;bind('sf',e=>p.effects=e.checked)}
 const motion=$('dnReduceMotion');if(motion){motion.checked=!p.motion;bind('dnReduceMotion',e=>p.motion=!e.checked)}
 const contrast=$('dnHighContrast');if(contrast){contrast.checked=p.contrast;bind('dnHighContrast',e=>p.contrast=e.checked)}
 const font=$('dnFontSize');if(font){font.value=p.font;bind('dnFontSize',e=>p.font=e.value)}
 document.addEventListener('visibilitychange',()=>{if(document.hidden){try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}});
})();
</script>
